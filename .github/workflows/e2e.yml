name: Live demo E2E
on:
  workflow_dispatch:
    inputs:
      module:
        description: Public demo suite to execute
        required: true
        type: choice
        options:
          - demowebshop-e2e-tests
          - demowebshop-e2e-tests-testng
          - parabank-cucumber-tests
          - shopdemo-e2e-tests
          - nopcommerce-admin-testng
          - itera-tests
          - itera-tests-xpath
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run selected suite
        env:
          MODULE: ${{ inputs.module }}
        run: bash mvnw -B -ntp -pl ":$MODULE" -am verify
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            **/target/surefire-reports/
            **/target/cucumber-report.html
            **/target/cucumber.json
            **/target/screenshots/
          if-no-files-found: warn
